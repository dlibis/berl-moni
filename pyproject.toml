[project]
name = "moni"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# Web set only: this is what Vercel installs.
dependencies = [
    "flask>=3.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
check = [
    "psycopg[binary]>=3.3.6",
]
bot = [
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "langchain>=1.3.12",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.4",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pymupdf4llm>=1.28.2",
    "python-bidi>=0.6.11",
    "reportlab>=5.0.1",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "web.app:app"
