[project]
name = "moni"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# Web set only: this is what Vercel installs.
dependencies = [
    "flask>=3.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
bot = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pydantic-ai-slim[google,openai]>=2.63.0",
    "pymupdf4llm>=1.28.2",
    "python-bidi>=0.6.11",
    "reportlab>=5.0.1",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "web.app:app"
