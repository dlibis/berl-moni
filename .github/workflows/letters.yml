name: letters

on:
  # Neon letters-hourly checks eligibility before dispatching this workflow.
  workflow_dispatch:
    inputs:
      mode:
        description: "drain: analyze queued letters"
        required: false
        type: choice
        options: [drain]

concurrency:
  group: letters
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb
      - run: uv sync --group bot
      - run: uv run --no-sync python -m bot.entrypoints.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          KNESSET_FETCH_URL: ${{ vars.KNESSET_FETCH_URL }}
          KNESSET_FETCH_TOKEN: ${{ secrets.KNESSET_FETCH_TOKEN }}
