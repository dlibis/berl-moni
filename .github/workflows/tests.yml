name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      # The local test database (tests/conftest.py): same major version as Neon. The Neon-only
      # tests (neon_test_db_url) skip here, since TEST_DATABASE_URL is not set.
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: moni_test
        ports: ["54318:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d moni_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb
      - run: uv sync --group bot
      - run: uv run --no-sync pytest -q
