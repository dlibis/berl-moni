name: migrate

on:
  push:
    branches: [main]
    paths: ["db/migrations/**"]
  workflow_dispatch:

concurrency: migrate

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --no-dev --no-install-project # web set: psycopg + python-dotenv
      - run: uv run --no-sync db/migrate.py
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
