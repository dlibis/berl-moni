name: migrate

on:
  push:
    branches: [main]
    paths: ["db/migrations/**"]

concurrency: migrate

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --no-install-project  # web set: psycopg + python-dotenv
      - run: uv run --no-sync db/migrate.py
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
